# Flow for iPhone — generate the Xcode project with XcodeGen:
#   cd ios && xcodegen generate
# The team and bundle id prefix come from ios/Local.xcconfig (not committed;
# copy Local.xcconfig.example). shell-kit and sync-kit are siblings of this
# repository, as for every toolkit app: ../shell-kit, ../sync-kit.
name: Flow
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  shell-kit:
    path: ../../shell-kit
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Flow:
    type: application
    platform: iOS
    sources:
      - path: Flow
      - path: Shared
    dependencies:
      - package: shell-kit
        product: ToolkitShell
      - target: FlowWidgets
        embed: true
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
    info:
      path: Flow/Info.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [flow]
        NSHealthShareUsageDescription: "Flow reads last night's sleep and yesterday's steps to suggest your morning stamina and mana. Your own rating is what counts; nothing is written to Health, and the numbers are not saved in Flow."
        NSLocationWhenInUseUsageDescription: "When you set a Flow place to where you are standing, Flow reads your location once to mark it. The location stays on this iPhone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Flow notes when you arrive at and leave the places you marked, even when it is closed, to log your day and the drive between places. Where the places are stays on this iPhone; only their names reach your Flow records."
        FlowAppGroup: $(APP_GROUP)
        FlowPortalOrigin: $(PORTAL_ORIGIN)
    entitlements:
      path: Flow/Flow.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).flow
        PRODUCT_NAME: Flow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Copy the web app into web/
        script: '"${SRCROOT}/scripts/copy-web.sh"'
        basedOnDependencyAnalysis: false
  FlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FlowWidgets
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: FlowWidgets/Info.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FlowAppGroup: $(APP_GROUP)
    entitlements:
      path: FlowWidgets/FlowWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).flow.widgets
        PRODUCT_NAME: FlowWidgets
        SKIP_INSTALL: YES
  FlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlowTests
      - path: Shared
      - path: Flow/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).flow.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Flow:
    build:
      targets:
        Flow: all
        FlowWidgets: all
    test:
      targets:
        - FlowTests
      gatherCoverageData: false
