<!doctype html>
<html lang="en" data-app="flow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2340">
<title>Flow</title>
<!-- Flow's own look (the handheld lower screen). ui-kit is loaded inside it as
     a lower cascade layer, only for the Portal's shared top bar. -->
<link rel="stylesheet" href="src/styles.css">
<script type="module">
  import { initTheme, detectMacDesktop } from './ui-kit/js/theme.js';
  initTheme({ app: 'flow', macInset: detectMacDesktop() });
</script>
<script type="module" src="ui-kit/js/sync-status.js"></script>
<script type="module" src="ui-kit/js/portal-bar.js"></script>
</head>
<body>
  <!-- Inside the Portal only (src/app.js stamps it in): anywhere else there is no /auth/me to ask. -->
  <template id="portal-bar-tpl"><sc-portal-bar app="flow"></sc-portal-bar></template>
  <div class="ds" id="shell">
    <div class="ds-screen" id="screen">
      <header class="ds-top">
        <h1 class="visually-hidden" id="view-title">Now</h1>
        <div id="strip"></div>
      </header>
      <nav class="ds-tabs" id="nav" aria-label="Screens"></nav>
      <main class="ds-main" id="view" tabindex="-1"><div class="ds-boot">Loading…</div></main>
    </div>
    <div class="ds-toasts" id="toasts" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
