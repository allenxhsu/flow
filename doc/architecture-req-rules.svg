</style><rect x="-26" y="-36" width="2082" height="532" fill="#fff"/><rect class="d-frame" x="-10" y="-20" width="2050" height="500"/><path class="d-frame-tab" d="M-10 -20h206.2v14l-10 10H-10z"/><text class="d-mono" x="0" y="-4">req [package] Rules [Rules]</text><g class="d-symbols"><g class="d-sym c-b" data-sym="sy_055" transform="translate(40 40)"><rect class="d-shape" width="300" height="136"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">The rules are pure</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;FL1&quot;</text><text x="10" y="80">text = &quot;model.js shall touch no DOM, no</text><text x="10" y="96">storage and no clock it was not handed, so the</text><text x="10" y="112">page, the CLI and the tests run the same</text><text x="10" y="128">rules.&quot;</text></g><g class="d-sym c-b" data-sym="sy_056" transform="translate(370 40)"><rect class="d-shape" width="304" height="120"/><text class="d-mono" x="152" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="152" y="36" text-anchor="middle">Events are write-once</text><path class="d-rule" d="M0 46H304"/><text x="10" y="64">id = &quot;FL2&quot;</text><text x="10" y="80">text = &quot;done, rework, purchase, energy,</text><text x="10" y="96">review, moment and visit shall never be edited;</text><text x="10" y="112">a correction is a new event.&quot;</text></g><g class="d-sym c-b" data-sym="sy_057" transform="translate(700 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Never rewrite a plan</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;FL3&quot;</text><text x="10" y="80">text = &quot;Flow shall write into Planner’s</text><text x="10" y="96">workspace only flow.op records — addTask and</text><text x="10" y="112">timesheet.&quot;</text></g><g class="d-sym c-b" data-sym="sy_058" transform="translate(1030 40)"><rect class="d-shape" width="301" height="104"/><text class="d-mono" x="150.5" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150.5" y="36" text-anchor="middle">Places stay on the device</text><path class="d-rule" d="M0 46H301"/><text x="10" y="64">id = &quot;FL4&quot;</text><text x="10" y="80">text = &quot;Geofence coordinates shall never be in</text><text x="10" y="96">a record, a sync, a log or a repository.&quot;</text></g><g class="d-sym c-b" data-sym="sy_059" transform="translate(1360 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Tests before code</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;FL5&quot;</text><text x="10" y="80">text = &quot;Every change shall start with failing</text><text x="10" y="96">tests from SPEC.md; acceptance tests are</text><text x="10" y="112">written without reading the implementation.&quot;</text></g><g class="d-sym c-b" data-sym="sy_060" transform="translate(1690 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">No external origins</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;FL6&quot;</text><text x="10" y="80">text = &quot;Storage keys shall be prefixed flow.;</text><text x="10" y="96">no fonts or CDNs from another origin; no app</text><text x="10" y="112">paths under /w/ or /assets/.&quot;</text></g><g class="d-sym " data-sym="sy_061" transform="translate(40 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Rules</text></g><g class="d-sym " data-sym="sy_062" transform="translate(370 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Event</text></g><g class="d-sym " data-sym="sy_063" transform="translate(700 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Planner bridge</text></g><g class="d-sym " data-sym="sy_064" transform="translate(1030 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">iPhone app</text></g><g class="d-sym " data-sym="sy_065" transform="translate(1360 330)"><path class="d-shape" d="M0 0H86V20H0Z"/><rect class="d-shape" y="20" width="200" height="76"/><text class="d-name" x="8" y="14" text-anchor="start">SPEC.md</text></g><g class="d-sym " data-sym="sy_066" transform="translate(1690 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Page</text></g></g><g class="d-paths"><g class="d-path" data-path="pa_051"><path class="d-hit" d="M140 330L140 253L190 253L190 176"/><path class="d-line dashed" d="M140 330L140 253L190 253L190 176"/><path class="d-head" transform="translate(190 176) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="146" y="284.5" width="67.4" height="15"/><text class="d-mono" x="179.7" y="295.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_052"><path class="d-hit" d="M470 330L470 245L522 245L522 160"/><path class="d-line dashed" d="M470 330L470 245L522 245L522 160"/><path class="d-head" transform="translate(522 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="476" y="280.5" width="67.4" height="15"/><text class="d-mono" x="509.7" y="291.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_053"><path class="d-hit" d="M800 330L800 245L850 245L850 160"/><path class="d-line dashed" d="M800 330L800 245L850 245L850 160"/><path class="d-head" transform="translate(850 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="806" y="280.5" width="67.4" height="15"/><text class="d-mono" x="839.7" y="291.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_054"><path class="d-hit" d="M1130 330L1130 237L1181 237L1181 144"/><path class="d-line dashed" d="M1130 330L1130 237L1181 237L1181 144"/><path class="d-head" transform="translate(1181 144) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1136" y="276.5" width="67.4" height="15"/><text class="d-mono" x="1169.7" y="287.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_055"><path class="d-hit" d="M1460 330L1460 245L1510 245L1510 160"/><path class="d-line dashed" d="M1460 330L1460 245L1510 245L1510 160"/><path class="d-head" transform="translate(1510 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1466" y="280.5" width="67.4" height="15"/><text class="d-mono" x="1499.7" y="291.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_056"><path class="d-hit" d="M1790 330L1790 245L1840 245L1840 160"/><path class="d-line dashed" d="M1790 330L1790 245L1840 245L1840 160"/><path class="d-head" transform="translate(1840 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1796" y="280.5" width="67.4" height="15"/><text class="d-mono" x="1829.7" y="291.5" text-anchor="middle">«satisfy»</text></g></g><g class="d-ports"></g></svg>
